[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-with-rvc"
version = "0.1.10"
description = "TTS with RVC pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Atm4x"}]
keywords = ["tts", "rvc", "voice-conversion", "speech-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "huggingface_hub",
    "av",
    "torch",
    "edge-tts",
    "numpy==1.26.0",
    "librosa==0.9.1",
    "faiss-cpu==1.10.0",
    "soundfile>=0.12.1",
    "ffmpeg-python>=0.2.0",
    "praat-parselmouth>=0.4.2",
    "resampy>=0.4.2",
    "scikit-learn",
    "tqdm>=4.63.1",
    "audioread",
    "pyworld==0.3.5",
    "torchcrepe==0.0.20",
    "numba==0.60.0",
    "cffi<2.0.0",
    "einops",
    "local_attention",
    "fairseq-built; sys_platform == 'win32' and python_version >= '3.10' and python_version < '3.13'",
    "fairseq-fixed; sys_platform != 'win32' or python_version < '3.10' or python_version >= '3.13'"
]

[project.urls]
Homepage = "https://github.com/Atm4x/tts-with-rvc"
Repository = "https://github.com/Atm4x/tts-with-rvc"
"Bug Tracker" = "https://github.com/Atm4x/tts-with-rvc/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tts_with_rvc*"]
