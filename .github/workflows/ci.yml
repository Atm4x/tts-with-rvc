name: Package CI

on:
  push:
    branches-ignore: [releases, releases-onnx]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      name:
        value: ${{ jobs.build.outputs.name }}
      version:
        value: ${{ jobs.build.outputs.version }}
      environment:
        value: ${{ jobs.build.outputs.environment }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-test.txt
      - name: Check source metadata
        id: metadata
        run: python .github/scripts/package.py check
      - name: Install CPU PyTorch for device tests
        if: steps.metadata.outputs.name != 'tts-with-rvc-onnx'
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test publishing safeguards
        run: python -m unittest discover -s .github/tests -v
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      environment: ${{ steps.metadata.outputs.environment }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'packaging>=24,<27'
      - name: Check release version and branch
        id: metadata
        env:
          RELEASE_CHECK: ${{ inputs.release && 'true' || 'false' }}
        run: |
          if [ "$RELEASE_CHECK" = true ]; then
            python .github/scripts/package.py check --release
          else
            python .github/scripts/package.py check
          fi
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Verify distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          python .github/scripts/package.py verify
          python .github/scripts/package.py smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
